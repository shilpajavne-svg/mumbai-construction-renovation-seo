name: MilesWeb Ultimate Deploy

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Syncing Files
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Fetch Code
      uses: actions/checkout@v3
    
    - name: 🚀 Transfer Code
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.server }}
        username: ${{ secrets.username }}
        password: ${{ secrets.password }}
        server-dir: ./public_html/
        port: 22                 # mPanel इसी पोर्ट पर बाहर के कनेक्शन स्वीकार करता है
